<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Hotline shooter</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="hotlineShooter.css">
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Hotline shooter</h1>
      <span class="version-pill">v 1.3</span>
    </header>
    <p class="welcome">Skjut dig genom nivån</p>
    <p class="home-link-wrapper"><a class="home-link" href="index.html">Till startsidan</a></p>

    <section class="scoreboard" aria-label="Spelarstatistik">
      <div class="score-grid">
        <div class="score-cell">
          <span class="score-label">Högsta poäng hittills <span class="score-episode">(Episod <span id="best-episode">–</span>)</span></span>
          <span class="score-value" id="best-score">–</span>
        </div>
        <div class="score-cell">
          <span class="score-label">Utforskning</span>
          <span class="score-value" id="exploration-score">–</span>
        </div>
      </div>
      <div class="icon-legend">
        <h2>Ikonförklaring</h2>
        <ul>
          <li><span class="icon">🎯</span> Mål (+10p)</li>
          <li><span class="icon">⚠️</span> Fara (-10p)</li>
        </ul>
      </div>
    </section>

    <canvas id="c" width="1200" height="760"></canvas>
  </div>
  <div id="overlay"><div class="card">
    <div id="msg" style="font-size:28px;margin-bottom:10px"></div>
    <button id="replay">Replay</button>
  </div></div>
  <script src="hotlineShooter.js"></script>
</body>
</html>
